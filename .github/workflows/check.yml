name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf8
      K: skills/suup-jejak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 성취기준 찾기
        run: node "$K/scripts/standards.mjs" get 9과15-01
      - name: 견본으로 지도안·활동지 만들고 구조 점검
        run: |
          for d in "$K"/examples/*/; do
            out="$RUNNER_TEMP/$(basename "$d")"
            mkdir -p "$out"
            python "$K/scripts/check_design.py" "$d/design.json"
            python "$K/scripts/make_plan.py"  "$d/design.json" -o "$out/지도안.hwpx"
            python "$K/scripts/make_sheet.py" "$d/design.json" -o "$out/활동지.hwpx"
            python "$K/scripts/validate_hwpx.py" "$out/지도안.hwpx" "$out/활동지.hwpx"
          done
      - name: 저장소의 견본 파일과 같은지 확인
        run: |
          python - <<'PY'
          import os, zipfile, glob, sys
          bad = 0
          for d in glob.glob(os.environ['K'] + '/examples/*/'):
              name = os.path.basename(os.path.normpath(d))
              for f in ('지도안.hwpx', '활동지.hwpx'):
                  a = zipfile.ZipFile(os.path.join(d, f)); b = zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'], name, f))
                  for n in a.namelist():
                      if a.read(n) != b.read(n):
                          print('다름:', name, f, n); bad = 1
          sys.exit(bad)
          PY
      - name: kordoc으로 견본 PDF 읽기
        run: |
          pdf="$K/examples/과학-9과15-01-1차시/활동지.pdf"
          npx -y kordoc@4 "$pdf" -o "$RUNNER_TEMP/활동지.md"
          grep -q "연주시차" "$RUNNER_TEMP/활동지.md"
          npx -y kordoc@4 "$pdf" --pages 2 -o "$RUNNER_TEMP/2쪽.md"
          grep -q "스스로 점검" "$RUNNER_TEMP/2쪽.md"
